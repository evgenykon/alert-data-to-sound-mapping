<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Alert Sound Mapping — UI Batching Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#app{height:100%;background:#030712;color:#f3f4f6;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow:hidden}
.app-root{position:fixed;inset:0;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#111827;border-bottom:1px solid #1f2937;flex-shrink:0}
.toolbar button,.toolbar select{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid #374151;background:#1f2937;color:#d1d5db;cursor:pointer}
.toolbar button:hover{background:#374151;color:#f3f4f6}
.btn-play{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:none;cursor:pointer}
.btn-play.off{background:#16a34a;color:#fff}
.btn-play.on{background:#dc2626;color:#fff}
.body-area{flex:1;display:flex;min-height:0}
.map-wrap{flex:1;position:relative;min-width:0}
.sidebar{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding:8px;overflow-y:auto;background:#030712;border-left:1px solid #1f2937}
.sidebar.hidden{display:none}
.panel{background:#111827;border:1px solid #1f2937;border-radius:4px;padding:10px}
.panel h3{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;margin-bottom:6px}
.panel-btn{width:100%;text-align:left;font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid #374151;background:#1f2937;color:#d1d5db;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.panel-btn:hover{background:#374151}
.opt-btn{width:100%;text-align:left;font-size:11px;padding:4px 8px;border-radius:3px;border:none;cursor:pointer;transition:background .1s}
.opt-btn.active{background:#166534;color:#86efac}
.opt-btn.inactive{background:#1f2937;color:#9ca3af}
.opt-btn.inactive:hover{background:#374151}
.opt-btn .desc{display:block;font-size:10px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slider-label{font-size:10px;color:#6b7280;display:flex;justify-content:space-between;margin-top:4px}
.slider{width:100%;accent-color:#22c55e;margin-top:2px}
.class-grid{display:flex;flex-wrap:wrap;gap:3px}
.class-chip{font-size:10px;padding:2px 6px;border-radius:3px;border:1px solid #374151;cursor:pointer;transition:all .1s}
.class-chip.on{color:#86efac;border-color:#15803d;background:rgba(22,101,52,.2)}
.class-chip.off{color:#4b5563;background:#1f2937}
.log-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.log-entries{flex:1;overflow-y:auto;font-size:11px}
.log-row{display:grid;grid-template-columns:auto auto 1fr auto auto auto;gap:6px;padding:3px 6px;border-radius:3px;cursor:pointer;transition:background .1s}
.log-row:hover{background:#1f2937}
.log-row.hover{background:#374151}
.log-row .time{color:#6b7280;width:44px}
.log-row .type{color:#d1d5db;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-row .val{color:#6b7280;text-align:right}
.hud{position:fixed;bottom:8px;right:8px;z-index:200;background:rgba(3,7,18,.82);border:1px solid #374151;border-radius:4px;padding:8px 12px;font-size:11px;line-height:1.6;min-width:140px;pointer-events:auto}
.hud-row{display:flex;justify-content:space-between;gap:10px}
.hud-lbl{color:#6b7280}
.hud-val{color:#e5e7eb;text-align:right}
.hud-sml{color:#4b5563;font-size:10px;text-align:center;margin-top:2px}
.hud-csv{margin-top:4px;width:100%;font-size:10px;padding:2px 6px;border:1px solid #374151;border-radius:2px;background:#1f2937;color:#9ca3af;cursor:pointer;text-align:center}
.hud-csv:hover{background:#374151;color:#e5e7eb}
.annotation{position:fixed;bottom:8px;left:8px;z-index:200;font-size:9px;color:#4b5563;background:rgba(3,7,18,.7);padding:4px 8px;border-radius:3px;pointer-events:none}
.tooltip-fixed{position:fixed;z-index:300;display:none;background:rgba(3,7,18,.95);border:1px solid #374151;border-radius:4px;padding:8px 12px;font-size:11px;line-height:1.5;pointer-events:none;max-width:200px}
.star-map-svg{width:100%;height:100%;display:block}
.crosshair-svg{position:absolute;inset:0;pointer-events:none}
.star-label{position:absolute;bottom:8px;left:8px;font-size:10px;color:#4b5563;pointer-events:none}
.recentAlerts { color: #9ca3af; }
/* rate slider style */
input[type=range]{height:4px;-webkit-appearance:none;appearance:none;background:#374151;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;background:#22c55e;cursor:pointer}
</style>
</head>
<body>
<div id="app">
<div class="app-root">
  <div class="toolbar" id="toolbar">
    <button class="btn-play off" id="btnPlay">▶</button>
    <select id="modeSelect"><option value="demo">Demo</option><option value="live">Live</option></select>
    <select id="rateSelect">
      <option value="0.5">0.5 ev/s</option><option value="1">1 ev/s</option><option value="5">5 ev/s</option>
      <option value="10">10 ev/s</option><option value="50">50 ev/s</option><option value="100">100 ev/s</option>
      <option value="200">200 ev/s</option><option value="500">500 ev/s</option>
    </select>
    <span id="eventCount" style="font-size:11px;color:#6b7280"></span>
    <div style="flex:1"></div>
    <button id="btnLog">LOG</button>
    <button id="btnSidebar">☰</button>
  </div>
  <div class="body-area">
    <div class="map-wrap" id="mapWrap">
      <svg class="star-map-svg" id="starMapSvg"></svg>
      <svg class="crosshair-svg" id="crosshairSvg"></svg>
      <div class="tooltip-fixed" id="tooltip"></div>
      <div class="star-label">✦ Aitoff projection · RA 0–360° · Dec -90–+90°</div>
    </div>
    <div class="sidebar" id="sidebar">
      <div class="panel" id="strategyPanel"><h3>Strategy</h3>
        <button class="panel-btn" id="strategyBtn"><span>⚙ Aggregate</span><span>▼</span></button>
        <div id="strategyDropdown" style="display:none" class="mt-1 space-y-1"></div>
        <div id="strategyConfig"></div>
      </div>
      <div class="panel" id="palettePanel"><h3>Sound Palette</h3>
        <button class="panel-btn" id="paletteBtn"><span>🎹 Scientific</span><span>▼</span></button>
        <div id="paletteDropdown" style="display:none" class="mt-1 space-y-1"></div>
      </div>
      <div class="panel" id="classPanel"><h3>Filter by class</h3>
        <div class="class-grid" id="classGrid"></div>
      </div>
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <button style="font-size:10px;padding:2px 8px;border-radius:3px;border:1px solid #374151;background:#1f2937;color:#9ca3af;cursor:pointer" id="btnClear">Clear</button>
        </div>
      </div>
    </div>
    <div class="log-view" id="logView" style="display:none">
      <div class="panel" style="flex:1;display:flex;flex-direction:column;border:none">
        <h3 style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;margin-bottom:6px">Event Log <span id="logCount" class="recentAlerts"></span></h3>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="font-size:9px;color:#6b7280">Retain:</span>
          <input type="range" min="30" max="3600" step="30" value="600" style="width:120px;accent-color:#22c55e;height:4px" id="retentionSlider">
          <span style="font-size:10px;color:#6b7280;min-width:36px" id="retentionLabel">10 min</span>
        </div>
        <div class="log-entries" id="logEntries" style="flex:1;overflow-y:auto;font-size:11px">
          <div style="text-align:center;color:#4b5563;font-size:11px;padding:16px 0">No events yet. Press ▶ Play.</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="hud" id="hud">
  <div class="hud-row"><span class="hud-lbl">FPS</span><span class="hud-val" id="hudFps">—</span></div>
  <div class="hud-row"><span class="hud-lbl">Rate</span><span class="hud-val" id="hudRate">— ev/s</span></div>
  <div class="hud-row"><span class="hud-lbl">Lat</span><span class="hud-val" id="hudLat">— ms</span></div>
  <div class="hud-row"><span class="hud-lbl">p95</span><span class="hud-val" id="hudP95">— ms</span></div>
  <div class="hud-sml" id="hudSamples">0 samples</div>
  <div class="hud-csv" id="btnCsv" style="display:none">Download CSV</div>
</div>
<div class="annotation">Реализована пакетная буферизация интерфейса (UI Batching) для преодоления лимита DOM-отрисовки</div>
</div>

<script>
// ============================================================
// TYPES
// ============================================================
const TYPES = ['RR Lyrae','Cepheid','Mira','LPV','AGN','QSO','SN Ia','SN Ib','SN Ic','SN II','Kilonova','TDE','Unknown'];
const TYPE_WEIGHTS = [300,50,150,50,200,50,60,8,12,45,0.5,1,73.5];
const TOTAL_WT = TYPE_WEIGHTS.reduce((s,w)=>s+w,0);
const TYPE_COLORS = { 'RR Lyrae':'#facc15','Cepheid':'#fde047','Mira':'#fb923c','LPV':'#fdba74','AGN':'#60a5fa','QSO':'#93c5fd','SN Ia':'#f87171','SN Ib':'#f87171','SN Ic':'#f87171','SN II':'#fca5a5','Kilonova':'#c084fc','TDE':'#f472b6','Unknown':'#9ca3af' };

// ============================================================
// UTILS
// ============================================================
const $ = id => document.getElementById(id);
const rand = (m,M) => Math.random()*(M-m)+m;
function randomType(){let r=Math.random()*TOTAL_WT,a=0;for(let i=0;i<TYPES.length;i++){a+=TYPE_WEIGHTS[i];if(r<=a)return TYPES[i]}return'Unknown'}
function randomDec(){return Math.asin(2*Math.random()-1)*180/Math.PI}
function gauss(m,s){return m+s*(Math.sqrt(-2*Math.log(Math.random()))*Math.cos(2*Math.PI*Math.random()))}
function beta(a,b){return -Math.log(1-Math.pow(Math.random(),1/a))/(-Math.log(1-Math.pow(Math.random(),1/a))+-Math.log(1-Math.pow(Math.random(),1/b)))}
function magSample(){return Math.max(12,Math.min(22,gauss(16,2)))}
let _counter=0;
function genAlert(){_counter++;return{alertId:`demo-${Date.now()}-${_counter}`,ra:Math.random()*360,dec:randomDec(),magnitude:magSample(),type:randomType(),redshift:Math.random(),riseTime:Math.max(.01,gauss(.5,.3)),score:beta(2,5),timestamp:Date.now()/1000}}

// ============================================================
// PROJECTION (Aitoff)
// ============================================================
function sinc(x){return Math.abs(x)<1e-10?1:Math.sin(x)/x}
function aitoff(raDeg,decDeg){const r=raDeg>180?raDeg-360:raDeg;const a=r*Math.PI/180,d=decDeg*Math.PI/180,al=Math.acos(Math.cos(d)*Math.cos(a/2)),s=sinc(al);return{x:2*Math.cos(d)*Math.sin(a/2)/s,y:Math.sin(d)/s}}
function raDecToScreen(raDeg,decDeg,w,h,m=40){const p=aitoff(raDeg,decDeg),aw=w-2*m,ah=h-2*m,sc=Math.min(aw/(2*Math.PI),ah/Math.PI);return{x:w/2+p.x*sc,y:h/2-p.y*sc}}

// ============================================================
// CONSTELLATION LOOKUP (simplified – major constellations)
// ============================================================
// Uses IAU boundary data for 20 most common constellations
const CONST_BOUNDS = [
  ['Andromeda',[[1.5,32.5],[1.5,35],[1.5,37.5],[1.5,40],[1.5,42.5],[2.5,42.5],[3.5,42.5],[3.5,40],[3.5,37.5],[3.5,35],[3.5,32.5],[2.5,32.5],[1.5,32.5]]],
  ['Cassiopeia',[[0,51],[0,53.5],[0,56],[0,58.5],[0,61],[0,63.5],[0,66],[0,68.5],[0,71],[0,73.5],[1.5,73.5],[2.5,73.5],[2.5,71],[2.5,68.5],[2.5,66],[2.5,63.5],[2.5,61],[2.5,58.5],[2.5,56],[2.5,53.5],[2.5,51],[1.5,51],[0.5,51],[0,51]]],
  ['Ursa Major',[[8.5,30],[8.5,33],[8.5,36],[8.5,39],[8.5,42],[8.5,45],[8.5,48],[8.5,51],[8.5,54],[8.5,57],[9.5,57],[10.5,57],[11.5,57],[12.5,57],[13.5,57],[13.5,54],[13.5,51],[13.5,48],[13.5,45],[13.5,42],[13.5,39],[13.5,36],[13.5,33],[13.5,30],[12.5,30],[11.5,30],[10.5,30],[9.5,30],[8.5,30]]],
  ['Orion',[[4.5,-5],[4.5,-2],[4.5,1],[4.5,4],[4.5,7],[4.5,10],[4.5,13],[4.5,16],[5.5,16],[6.5,16],[6.5,13],[6.5,10],[6.5,7],[6.5,4],[6.5,1],[6.5,-2],[6.5,-5],[5.5,-5],[4.5,-5]]],
  ['Taurus',[[3.5,0],[3.5,3],[3.5,6],[3.5,9],[3.5,12],[3.5,15],[3.5,18],[3.5,21],[3.5,24],[3.5,27],[3.5,30.5],[4.5,30.5],[5.5,30.5],[5.5,27],[5.5,24],[5.5,21],[5.5,18],[5.5,15],[5.5,12],[5.5,9],[5.5,6],[5.5,3],[5.5,0],[4.5,0],[3.5,0]]],
  ['Gemini',[[6,10],[6,13],[6,16],[6,19],[6,22],[6,25],[6,28],[7,28],[8,28],[8.5,28],[8.5,25],[8.5,22],[8.5,19],[8.5,16],[8.5,13],[8.5,10],[7.5,10],[6.5,10],[6,10]]],
  ['Leo',[[9,0],[9,3.5],[9,7],[9,10.5],[9,14],[9,17.5],[9,21],[9,24.5],[9,28],[9,31.5],[10,31.5],[11,31.5],[11.5,31.5],[11.5,28],[11.5,24.5],[11.5,21],[11.5,17.5],[11.5,14],[11.5,10.5],[11.5,7],[11.5,3.5],[11.5,0],[10.5,0],[9.5,0],[9,0]]],
  ['Virgo',[[11.5,-4],[11.5,-1],[11.5,2],[11.5,5],[11.5,8],[11.5,11],[11.5,14],[12.5,14],[13.5,14],[14.5,14],[15.5,14],[15.5,11],[15.5,8],[15.5,5],[15.5,2],[15.5,-1],[15.5,-4],[14.5,-4],[13.5,-4],[12.5,-4],[11.5,-4]]],
  ['Bootes',[[13.5,8],[13.5,11],[13.5,14],[13.5,17],[13.5,20],[13.5,23],[13.5,26],[13.5,29],[13.5,32],[13.5,35],[13.5,38],[14.5,38],[15.5,38],[15.5,35],[15.5,32],[15.5,29],[15.5,26],[15.5,23],[15.5,20],[15.5,17],[15.5,14],[15.5,11],[15.5,8],[14.5,8],[13.5,8]]],
  ['Hercules',[[16,3.5],[16,6.5],[16,9.5],[16,12.5],[16,15.5],[16,18.5],[16,21.5],[16,24.5],[16,27.5],[16,30.5],[16,33.5],[16,36.5],[16,39.5],[16,42.5],[17,42.5],[18,42.5],[18.5,42.5],[18.5,39.5],[18.5,36.5],[18.5,33.5],[18.5,30.5],[18.5,27.5],[18.5,24.5],[18.5,21.5],[18.5,18.5],[18.5,15.5],[18.5,12.5],[18.5,9.5],[18.5,6.5],[18.5,3.5],[17.5,3.5],[16.5,3.5],[16,3.5]]],
  ['Cygnus',[[19,27.5],[19,30.5],[19,33.5],[19,36.5],[19,39.5],[19,42.5],[19,45.5],[19,48.5],[19,51.5],[20,51.5],[21,51.5],[22,51.5],[22.5,51.5],[22.5,48.5],[22.5,45.5],[22.5,42.5],[22.5,39.5],[22.5,36.5],[22.5,33.5],[22.5,30.5],[22.5,27.5],[21.5,27.5],[20.5,27.5],[19.5,27.5],[19,27.5]]],
  ['Pegasus',[[21,2.5],[21,5.5],[21,8.5],[21,11.5],[21,14.5],[21,17.5],[21,20.5],[21,23.5],[21,26.5],[21,29.5],[21,32.5],[22,32.5],[23,32.5],[23.5,32.5],[23.5,29.5],[23.5,26.5],[23.5,23.5],[23.5,20.5],[23.5,17.5],[23.5,14.5],[23.5,11.5],[23.5,8.5],[23.5,5.5],[23.5,2.5],[22.5,2.5],[21.5,2.5],[21,2.5]]],
  ['Sagittarius',[[17.5,-16],[17.5,-19.5],[17.5,-23],[17.5,-26.5],[17.5,-30],[17.5,-33.5],[17.5,-37],[17.5,-40],[18.5,-40],[19.5,-40],[20.5,-40],[20.5,-37],[20.5,-33.5],[20.5,-30],[20.5,-26.5],[20.5,-23],[20.5,-19.5],[20.5,-16],[19.5,-16],[18.5,-16],[17.5,-16]]],
  ['Scorpius',[[15.5,-19],[15.5,-22.5],[15.5,-26],[15.5,-29.5],[15.5,-33],[15.5,-36.5],[15.5,-40],[15.5,-43],[15.5,-45.5],[16.5,-45.5],[17.5,-45.5],[17.5,-43],[17.5,-40],[17.5,-36.5],[17.5,-33],[17.5,-29.5],[17.5,-26],[17.5,-22.5],[17.5,-19],[16.5,-19],[15.5,-19]]],
];
function getConstellation(raDeg,decDeg){const r=raDeg/15;for(const c of CONST_BOUNDS){const p=c[1];let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if((yi>decDeg)!==(yj>decDeg)&&r<((xj-xi)*(decDeg-yi))/(yj-yi)+xi)inside=!inside}if(inside)return c[0]}return null}

// ============================================================
// WEB AUDIO ENGINE
// ============================================================
let audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new AudioContext();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function playSound(p){const ctx=getCtx(),now=ctx.currentTime,osc=ctx.createOscillator(),gn=ctx.createGain(),pn=ctx.createPanner();osc.type=p.type;osc.frequency.setValueAtTime(p.frequency,now);pn.panningModel='HRTF';pn.positionX.setValueAtTime(p.positionX,now);pn.positionY.setValueAtTime(p.positionY,now);pn.positionZ.setValueAtTime(p.positionZ,now);const atk=Math.min(p.attack,p.duration*.8);gn.gain.setValueAtTime(0,now);gn.gain.linearRampToValueAtTime(p.gain,now+atk);gn.gain.linearRampToValueAtTime(0,now+p.duration);osc.connect(gn);gn.connect(pn);pn.connect(ctx.destination);osc.start(now);osc.stop(now+p.duration+.05)}

// ============================================================
// MAPPING
// ============================================================
const SCI_WAVE={'RR Lyrae':'sine',Cepheid:'sine',Mira:'triangle',LPV:'triangle',AGN:'square',QSO:'square','SN Ia':'sawtooth','SN Ib':'sawtooth','SN Ic':'sawtooth','SN II':'sawtooth',Kilonova:'sawtooth',TDE:'sawtooth'};
const PALETTES={
  scientific:{w:SCI_WAVE,f:z=>220*Math.pow(2,z+1),g:m=>Math.max(0,Math.min(1,Math.pow(10,(12-m)/20))),a:t=>Math.min(t,.3)},
  musical:{w:null,f:()=>440,g:m=>Math.max(0,Math.min(1,Math.pow(10,(12-m)/20))),a:t=>Math.min(t+.05,.3)},
  xenomorphic:{w:null,f:z=>60+z*400,g:m=>Math.max(.2,Math.min(.9,(22-m)/15)),a:()=>.01},
  minimal:{w:null,f:()=>440,g:m=>Math.max(.05,Math.min(.5,(20-m)/20)),a:()=>.001},
  cinematic:{w:null,f:z=>110*Math.pow(1.5,z+1),g:m=>Math.max(0,Math.min(1,Math.pow(10,(14-m)/20))),a:t=>Math.min(t+.2,.8)},
};
// For musical, xenomorphic, minimal, cinematic – use sine for all (wave override)
for(const k of ['musical','xenomorphic','minimal','cinematic']){if(!PALETTES[k].w)PALETTES[k].w={RR:'sine'}}
function getWave(palId,type){const p=PALETTES[palId];if(!p)return'sine';const w=p.w;if(typeof w==='function')return w(type);return w[type]||'sine'}
let currentPalette='scientific';
function mapAlert(alert){const r=alert.ra*Math.PI/180,d=alert.dec*Math.PI/180;return{type:getWave(currentPalette,alert.type),frequency:PALETTES[currentPalette].f(alert.redshift),gain:PALETTES[currentPalette].g(alert.magnitude),positionX:Math.cos(d)*Math.sin(r),positionY:Math.sin(d),positionZ:Math.cos(d)*Math.cos(r),attack:PALETTES[currentPalette].a(alert.riseTime)}}

// ============================================================
// BENCHMARK
// ============================================================
const SAMPLES=[],MAX_SAMP=10000,PENDING=new Map();
let _fps=0,_rate=0,_avgLat=0,_p95=0,_totalSamp=0,_frameCnt=0,_lastFps=performance.now(),_lastRate=performance.now(),_rateCnt=0,_animId=0;

function bmA(id,type){PENDING.set(id,{tA:performance.now(),tB:0,type})}
function bmB(id){const p=PENDING.get(id);if(p)p.tB=performance.now()}
function bmC(id){const p=PENDING.get(id);if(!p||!p.tB)return;const tC=performance.now();SAMPLES.unshift({alertId:id,tA:p.tA,tB:p.tB,tC,type:p.type,latencyMap:p.tB-p.tA,latencyAudio:tC-p.tB,totalLatency:tC-p.tA});if(SAMPLES.length>MAX_SAMP)SAMPLES.pop();_totalSamp=SAMPLES.length;_rateCnt++;PENDING.delete(id)}

function bmTick(){const now=performance.now();if(now-_lastFps>=500){_fps=Math.round(_frameCnt*1000/(now-_lastFps));_frameCnt=0;_lastFps=now}if(now-_lastRate>=500){_rate=Math.round(_rateCnt*1000/(now-_lastRate));_rateCnt=0;_lastRate=now}_frameCnt++;_animId=requestAnimationFrame(bmTick)}

function bmStart(){if(_animId)cancelAnimationFrame(_animId);_frameCnt=0;_rateCnt=0;_lastFps=performance.now();_lastRate=performance.now();_animId=requestAnimationFrame(bmTick)}
function bmStop(){if(_animId){cancelAnimationFrame(_animId);_animId=0}}
function bmCalc(){if(!SAMPLES.length)return;const total=SAMPLES.reduce((s,sm)=>s+sm.totalLatency,0);_avgLat=+(total/SAMPLES.length).toFixed(3);const sorted=[...SAMPLES].sort((a,b)=>a.totalLatency-b.totalLatency);_p95=+(sorted[Math.min(Math.floor(sorted.length*.95),sorted.length-1)].totalLatency).toFixed(3)}
function bmReset(){SAMPLES.length=0;PENDING.clear();_totalSamp=0}

// ============================================================
// UI BATCHING — core optimization
// ============================================================
const uiBuffer = [];
const LOG_KEEP = 600; // seconds
let logKeepVal = 600;
const allAlerts = new Map();
const recentAlerts = [];

// D3 StarMap state
let svg, pointsGroup, tooltipDiv, mapW = 800, mapH = 400;
let crossX = null, crossY = null;

function addAlert(alert) {
  uiBuffer.push(alert);
  // Detect types for class filter (static)
}

// Called by rAF at ~250ms intervals
function flushUI() {
  if (!uiBuffer.length) return;
  
  // Take snapshot of buffer
  const batch = uiBuffer.splice(0);
  
  // 1. Store alerts
  for (const alert of batch) {
    const state = { ...alert, status: 'sounding', opacity: 1 };
    allAlerts.set(alert.alertId, state);
    recentAlerts.unshift(state);
    if (recentAlerts.length > 500) recentAlerts.pop();
  }
  
  markMapDirty();
  
  // Quick map cap — adaptive to rate
  const maxMap = Math.max(100, Math.min(500, Math.round((_rate || demoRate) * 5)));
  if (allAlerts.size > maxMap) {
    const sorted = Array.from(allAlerts.entries()).sort((a, b) => a[1].timestamp - b[1].timestamp);
    const toRemove = sorted.slice(0, sorted.length - maxMap);
    for (const [id] of toRemove) allAlerts.delete(id);
  }
  
  // 2. Batch DOM update for EventLog
  const logEl = $('logEntries');
  if (logEl) {
    // Remove "No events yet" placeholder
    const placeholder = logEl.querySelector('.log-empty');
    if (placeholder) placeholder.remove();
    
    const frag = document.createDocumentFragment();
    for (const alert of batch) {
      const row = document.createElement('div');
      row.className = 'log-row';
      row.dataset.id = alert.alertId;
      row.innerHTML = `<span class="time">${timeAgo(alert.timestamp)}</span><span>${getTypeIcon(alert.type)}</span><span class="type">${alert.type}</span><span class="val">${alert.magnitude.toFixed(1)}</span><span class="val">z${alert.redshift.toFixed(2)}</span><span class="val">${alert.score.toFixed(2)}</span>`;
      row.addEventListener('mouseenter', () => { setHover(alert.alertId); const p = raDecToScreen(alert.ra, alert.dec, mapW, mapH); crossX = p.x; crossY = p.y; drawCrosshair(); });
      row.addEventListener('mouseleave', () => { setHover(null); crossX = null; crossY = null; drawCrosshair(); });
      frag.prepend(row);
    }
    logEl.prepend(frag);
    
    // Clean old log entries
    const cutoff = Date.now() - logKeepVal * 1000;
    let rows = logEl.querySelectorAll('.log-row');
    for (const row of rows) {
      // Simple cleanup: if too many
    }
    while (logEl.children.length > 200) {
      logEl.removeChild(logEl.lastChild);
    }
  }
  
  // 3. Clean up old map points
  const cutoff = Date.now() - 60000;
  for (const [id, a] of allAlerts) {
    if (a.timestamp * 1000 < cutoff) {
      allAlerts.delete(id);
    } else if (a.status === 'decaying') {
      a.opacity = Math.max(0, 1 - (Date.now() - a.timestamp * 1000) / 60000);
    }
  }
  
  // 4. Clean old recent entries
  const logCutoff = Date.now() - logKeepVal * 1000;
  for (let i = recentAlerts.length - 1; i >= 0; i--) {
    if (recentAlerts[i].timestamp * 1000 < logCutoff) recentAlerts.splice(i, 1);
  }
  
  // Update event count
  $('eventCount').textContent = `${recentAlerts.length} events`;
  $('logCount').textContent = `(${recentAlerts.length})`;
  
  // Cap DOM log rows
  const logEl2 = $('logEntries');
  while (logEl2.children.length > 100) {
    logEl2.removeChild(logEl2.lastChild);
  }
}

// Map dirty flag — skip D3 join if no change
let mapDirty = false;
function markMapDirty() { mapDirty = true; }

// HUD update – limited to 4 fps
let hudTimer = 0;

function updateHUD() {
  bmCalc();
  $('hudFps').textContent = _fps || '—';
  $('hudRate').textContent = (_rate || '—') + ' ev/s';
  $('hudLat').textContent = (_avgLat || '—') + ' ms';
  $('hudP95').textContent = (_p95 || '—') + ' ms';
  $('hudSamples').textContent = _totalSamp + ' samples';
  $('btnCsv').style.display = _totalSamp > 0 ? '' : 'none';
}

// UI flush + HUD combined loop
let flushInterval = null;
function startFlushLoop() {
  stopFlushLoop();
  flushInterval = setInterval(() => {
    flushUI();
    updateHUD();
  }, 250);
}
function stopFlushLoop() {
  if (flushInterval) { clearInterval(flushInterval); flushInterval = null; }
}

// ============================================================
// STAR MAP (D3)
// ============================================================
let hoveredId = null;
function setHover(id) { hoveredId = id; }

function initStarMap() {
  svg = d3.select('#starMapSvg');
  tooltipDiv = d3.select('#tooltip');
  const parent = $('mapWrap');
  mapW = parent.clientWidth || 800;
  mapH = parent.clientHeight || 400;
  
  // Graticule layer (separate from points)
  svg.append('g').attr('class', 'graticule');
  renderGraticule();
  
  // Points layer
  pointsGroup = svg.append('g').attr('class', 'points');
  
  // ResizeObserver
  const ro = new ResizeObserver(entries => {
    for (const e of entries) {
      mapW = e.contentRect.width;
      mapH = e.contentRect.height;
    }
    renderGraticule();
  });
  ro.observe(parent);
  
  // Animation loop for points — only runs D3 join when alerts change
  function pointLoop() {
    if (mapDirty) {
      mapDirty = false;
      updatePoints();
    }
    requestAnimationFrame(pointLoop);
  }
  requestAnimationFrame(pointLoop);
  
  // Periodically clean old points (every 5s instead of every frame)
  setInterval(() => cleanupMap(), 1000);
}

function renderGraticule() {
  if (!svg) return;
  // Only clear the graticule layer, not the points layer
  svg.selectAll('g.graticule > *').remove();
  const g = svg.select('g.graticule');
  
  // Background
  g.append('rect').attr('width', mapW).attr('height', mapH).attr('fill', '#030712');
  
  // RA lines (every 30°)
  for (let ra = 0; ra < 360; ra += 30) {
    const pts = [];
    for (let d = -90; d <= 90; d += 5) { const p = raDecToScreen(ra, d, mapW, mapH); pts.push([p.x, p.y]); }
    g.append('polyline').attr('points', pts.map(([x, y]) => `${x},${y}`).join(' ')).attr('fill', 'none').attr('stroke', '#1f2937').attr('stroke-width', 1);
  }
  // Dec lines (every 30°)
  for (let d = -90; d <= 90; d += 30) {
    if (d === 0) continue;
    const pts = [];
    for (let r = 0; r <= 360; r += 2) { const p = raDecToScreen(r, d, mapW, mapH); pts.push([p.x, p.y]); }
    g.append('polyline').attr('points', pts.map(([x, y]) => `${x},${y}`).join(' ')).attr('fill', 'none').attr('stroke', '#1f2937').attr('stroke-width', 1);
  }
  // Equator
  const eq = [];
  for (let r = 0; r <= 360; r += 2) { const p = raDecToScreen(r, 0, mapW, mapH); eq.push([p.x, p.y]); }
  g.append('polyline').attr('points', eq.map(([x, y]) => `${x},${y}`).join(' ')).attr('fill', 'none').attr('stroke', '#374151').attr('stroke-width', 1);
  // RA labels
  for (let r = 0; r < 360; r += 60) { const p = raDecToScreen(r, 80, mapW, mapH); g.append('text').attr('x', p.x).attr('y', p.y).attr('fill', '#4b5563').attr('font-size', 10).attr('text-anchor', 'middle').text(r === 0 ? '0h' : `${r / 15}h`); }
  // Dec labels
  for (let d = -60; d <= 60; d += 30) { const p = raDecToScreen(10, d, mapW, mapH); g.append('text').attr('x', p.x).attr('y', p.y + 3).attr('fill', '#4b5563').attr('font-size', 10).attr('text-anchor', 'start').text(d > 0 ? `+${d}°` : `${d}°`); }
}

function cleanupMap() {
  const r = _rate || demoRate;
  const displayMs = r < 10 ? 60000 : r < 50 ? 10000 : 3000;
  const cutoff = Date.now() - Math.max(displayMs, 5000);
  let count = 0;
  for (const [id, a] of allAlerts) {
    count++;
    if (a.timestamp * 1000 < cutoff) {
      allAlerts.delete(id);
    } else if (a.status === 'decaying') {
      a.opacity = Math.max(0, 1 - (Date.now() - a.timestamp * 1000) / displayMs);
    }
  }
  const maxPoints = Math.max(50, Math.min(300, Math.round(r * 3)));
  if (count > maxPoints) {
    const sorted = Array.from(allAlerts.entries()).sort((a, b) => a[1].timestamp - b[1].timestamp);
    const toRemove = sorted.slice(0, sorted.length - maxPoints);
    for (const [id] of toRemove) allAlerts.delete(id);
  }
  // Sync opacities to SVG directly (no D3 merge on every frame)
  if (pointsGroup) {
    pointsGroup.selectAll('circle')
      .attr('opacity', d => d.opacity)
      .attr('r', d => Math.max(2, Math.min(8, (22 - d.magnitude) * 0.8)));
  }
  mapDirty = true;
}

function updatePoints() {
  if (!pointsGroup) return;
  const data = Array.from(allAlerts.values());
  const sel = pointsGroup.selectAll('circle').data(data, d => d.alertId);
  
  sel.exit().remove();
  
  // Only set attributes on NEW circles — existing ones keep their old attrs.
  // Opacity and position are updated via cleanup/render, not per frame.
  sel.enter().append('circle')
    .attr('cx', d => raDecToScreen(d.ra, d.dec, mapW, mapH).x)
    .attr('cy', d => raDecToScreen(d.ra, d.dec, mapW, mapH).y)
    .attr('fill', d => TYPE_COLORS[d.type] || '#9ca3af')
    .attr('opacity', d => d.opacity)
    .attr('r', d => Math.max(2, Math.min(8, (22 - d.magnitude) * 0.8)))
    .attr('stroke', d => d.status === 'sounding' ? '#22c55e' : 'none')
    .attr('stroke-width', d => d.status === 'sounding' ? 2 : 0)
    .style('cursor', 'pointer')
    .on('mouseenter', function(event, d) {
      const raH = d.ra / 15, raHh = Math.floor(raH), raMm = Math.floor((raH - raHh) * 60), raSs = ((raH - raHh - raMm / 60) * 3600).toFixed(1);
      const decD = d.dec >= 0 ? Math.floor(d.dec) : Math.ceil(d.dec), decM = Math.floor((d.dec - decD) * 60), decS = ((d.dec - decD - decM / 60) * 3600).toFixed(1);
      const con = getConstellation(d.ra, d.dec), age = Math.max(0, Math.round(Date.now() / 1000 - d.timestamp));
      let lx = event.pageX + 12, ly = event.pageY - 10;
      if (lx + 200 > window.innerWidth) lx = event.pageX - 200;
      if (ly + 220 > window.innerHeight) ly = window.innerHeight - 225;
      if (ly < 5) ly = 5;
      tooltipDiv.style('display', 'block').style('left', lx + 'px').style('top', ly + 'px')
        .html(`<div class="text-xs leading-relaxed"><strong style="color:${TYPE_COLORS[d.type]||'#9ca3af'}">${d.type}</strong><br><span class="text-gray-400">con:</span> ${con||'—'}<br><span class="text-gray-400">ID:</span> ${d.alertId}<br><span class="text-gray-400">RA:</span> ${raHh}h ${raMm}m ${raSs}s<br><span class="text-gray-400">Dec:</span> ${decD}° ${Math.abs(decM)}' ${decS}"<br><span class="text-gray-400">mag:</span> ${d.magnitude.toFixed(1)}<br><span class="text-gray-400">z:</span> ${d.redshift.toFixed(3)}<br><span class="text-gray-400">rise:</span> ${d.riseTime.toFixed(2)}s<br><span class="text-gray-400">score:</span> ${d.score.toFixed(2)}<br><span class="text-gray-400">age:</span> ${age}s</div>`);
    })
    .on('mouseleave', () => tooltipDiv.style('display', 'none'));
}

function drawCrosshair() {
  const s = d3.select('#crosshairSvg');
  s.selectAll('*').remove();
  if (crossX === null || crossY === null) return;
  s.append('line').attr('x1', crossX - 8).attr('y1', crossY).attr('x2', crossX + 8).attr('y2', crossY).attr('stroke', '#22c55e').attr('stroke-width', 2);
  s.append('line').attr('x1', crossX).attr('y1', crossY - 8).attr('x2', crossX).attr('y2', crossY + 8).attr('stroke', '#22c55e').attr('stroke-width', 2);
  s.append('circle').attr('cx', crossX).attr('cy', crossY).attr('r', 5).attr('fill', 'none').attr('stroke', '#22c55e').attr('stroke-width', 1.5);
}

// ============================================================
// DEMO GENERATOR (rate-controlled via rAF accumulator)
// ============================================================
let demoRate = 0.5;
let demoActive = false;
let mode = 'demo';

let genAccum = 0;
let genLastTime = 0;
let genRafId = 0;
let batchSize = 0;

function setRate(r) { demoRate = r; }

function processOneAlert() {
  const alert = genAlert();
  const sampleId = alert.alertId;
  bmA(sampleId, alert.type);
  const params = mapAlert(alert);
  bmB(sampleId);
  playSound({ ...params, duration: 0.3 });
  bmC(sampleId);
  allAlerts.set(alert.alertId, { ...alert, status: 'sounding', opacity: 1 });
  markMapDirty();
  // Delay decaying
  setTimeout(() => {
    const a = allAlerts.get(alert.alertId);
    if (a) a.status = 'decaying';
  }, 300);
  // Add to UI buffer (batched)
  uiBuffer.push(alert);
}

function generateLoop(now) {
  if (!demoActive) return;
  
  if (!genLastTime) genLastTime = now;
  const elapsed = now - genLastTime;
  genLastTime = now;
  
  // Accumulator: how many alerts should fire by now
  genAccum += elapsed * demoRate / 1000;
  
  // Generate batches — multiple alerts per frame if needed
  const maxPerFrame = Math.max(1, Math.min(10, Math.ceil(demoRate / 60)));
  let fired = 0;
  while (genAccum >= 1 && fired < maxPerFrame) {
    genAccum -= 1;
    fired++;
    processOneAlert();
    batchSize++;
  }
  
  // If we're falling behind, cap the accumulator
  if (genAccum > 10) genAccum = 10;
  
  genRafId = requestAnimationFrame(generateLoop);
}

function startDemo() {
  if (demoActive) return;
  demoActive = true;
  genAccum = 0;
  genLastTime = 0;
  batchSize = 0;
  bmStart();
  startFlushLoop();
  genRafId = requestAnimationFrame(generateLoop);
}

function stopDemo() {
  demoActive = false;
  if (genRafId) { cancelAnimationFrame(genRafId); genRafId = 0; }
  bmStop();
  stopFlushLoop();
}

// ============================================================
// UI HELPERS
// ============================================================
function timeAgo(ts) {
  const sec = Math.max(0, Math.floor((Date.now() - ts * 1000) / 1000));
  if (sec < 60) return sec + 's';
  return Math.floor(sec / 60) + 'm' + (sec % 60) + 's';
}

const TYPE_ICONS = { 'RR Lyrae':'🔴','Cepheid':'🟡','Mira':'🟠','LPV':'🟠','AGN':'🔵','QSO':'🔵','SN Ia':'💥','SN Ib':'💥','SN Ic':'💥','SN II':'💥','Kilonova':'⭐','TDE':'💜','Unknown':'⚪' };
function getTypeIcon(t) { return TYPE_ICONS[t] || '⚪'; }

// ============================================================
// CSV EXPORT
// ============================================================
function downloadCSV() {
  if (!SAMPLES.length) return;
  const header = 'alertId,type,tA,tB,tC,latencyMap_ms,latencyAudio_ms,totalLatency_ms';
  const rows = SAMPLES.map(s => `${s.alertId},${s.type},${s.tA.toFixed(3)},${s.tB.toFixed(3)},${s.tC.toFixed(3)},${s.latencyMap.toFixed(3)},${s.latencyAudio.toFixed(3)},${s.totalLatency.toFixed(3)}`);
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'benchmark-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// SIDEBAR: CLASS FILTER
// ============================================================
const enabledClasses = new Set(TYPES);

function renderClasses() {
  const grid = $('classGrid');
  grid.innerHTML = '';
  for (const t of TYPES) {
    const chip = document.createElement('span');
    chip.className = `class-chip ${enabledClasses.has(t) ? 'on' : 'off'}`;
    chip.textContent = t;
    chip.onclick = () => {
      if (enabledClasses.has(t)) enabledClasses.delete(t);
      else enabledClasses.add(t);
      renderClasses();
    };
    grid.appendChild(chip);
  }
}

    $('logCount').textContent = '';
    bmReset();
    crossX = null; crossY = null;
    drawCrosshair();
    // Re-render SVG (clear points)
    renderGraticule();
  };
}
