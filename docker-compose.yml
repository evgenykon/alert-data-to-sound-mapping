services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ALERT_SOURCE: "${ALERT_SOURCE:-demo}"
      KAFKA_BROKER: "${KAFKA_BROKER}"
      KAFKA_TOPIC: "${KAFKA_TOPIC}"
      KAFKA_USER: "${KAFKA_USER}"
      KAFKA_PASS: "${KAFKA_PASS}"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - production

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    environment:
      VITE_WS_URL: "ws://backend:3000"
    profiles:
      - dev
